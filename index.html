<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FitRoutine — Calisthenics Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #f5f7fa;
    }

    .container {
      width: min(1000px, 92%);
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    h1 {
      text-align: center;
      font-size: 38px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aeb7c2;
      margin-bottom: 30px;
    }

    .card {
      background: #141a22;
      border: 1px solid #27313d;
      border-radius: 18px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
    }

    h3 {
      margin-bottom: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    label {
      display: block;
      color: #cbd3dc;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #354150;
      background: #0e1319;
      color: white;
      font-size: 16px;
    }

    input:focus,
    select:focus {
      outline: 2px solid #5eead4;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      background: #5eead4;
      color: #071012;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      filter: brightness(1.08);
    }

    .secondary {
      background: #27313d;
      color: white;
    }

    .day {
      border: 1px solid #303b48;
      border-radius: 15px;
      padding: 18px;
      margin-top: 15px;
      background: #10161d;
    }

    .day-title {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .exercise {
      padding: 13px 0;
      border-bottom: 1px solid #27313d;
    }

    .exercise:last-child {
      border-bottom: none;
    }

    .exercise-name {
      font-weight: bold;
      font-size: 17px;
    }

    .details {
      color: #aeb7c2;
      margin-top: 5px;
    }

    .tag {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #202a35;
      color: #8ff5e4;
      font-size: 12px;
      margin-top: 7px;
    }

    .tip {
      background: #101b1c;
      border-left: 4px solid #5eead4;
      padding: 12px;
      border-radius: 8px;
      color: #d7f8f2;
      margin-top: 12px;
    }

    .warning {
      background: #1c1710;
      border-left: 4px solid #f0b45b;
      padding: 12px;
      border-radius: 8px;
      color: #f7dfb8;
      margin-top: 12px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #0e1319;
      border-radius: 12px;
      padding: 14px;
      text-align: center;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      margin-bottom: 4px;
    }

    .small {
      color: #8e9aa7;
      font-size: 13px;
    }

    @media (max-width: 700px) {
      h1 {
        font-size: 30px;
      }

      .grid,
      .summary {
        grid-template-columns: 1fr;
      }

      .container {
        width: 94%;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <h1>💪 FitRoutine</h1>
  <p class="subtitle">
    Jouw persoonlijke calisthenics-routine
  </p>

  <div class="card">
    <h2>📊 Jouw niveau</h2>

    <div class="grid">

      <div>
        <label>Push-ups maximaal</label>
        <input id="pushups" type="number" min="0" placeholder="bijv. 20">
      </div>

      <div>
        <label>Pull-ups maximaal</label>
        <input id="pullups" type="number" min="0" placeholder="bijv. 5">
      </div>

      <div>
        <label>Dips maximaal</label>
        <input id="dips" type="number" min="0" placeholder="bijv. 8">
      </div>

      <div>
        <label>Squats maximaal</label>
        <input id="squats" type="number" min="0" placeholder="bijv. 30">
      </div>

      <div>
        <label>Sit-ups maximaal</label>
        <input id="situps" type="number" min="0" placeholder="bijv. 25">
      </div>

      <div>
        <label>Plank maximaal (seconden)</label>
        <input id="plank" type="number" min="0" placeholder="bijv. 60">
      </div>

      <div>
        <label>Handstand hold (seconden)</label>
        <input id="handstand" type="number" min="0" placeholder="bijv. 10">
      </div>

      <div>
        <label>Lage handstand / kick-up niveau</label>
        <select id="handstandLevel">
          <option value="0">Nog niet</option>
          <option value="1">Ik oefen kick-ups</option>
          <option value="2">Ik kan soms staan</option>
          <option value="3">Ik kan redelijk stabiel staan</option>
          <option value="4">Ik kan hem goed controleren</option>
        </select>
      </div>

      <div>
        <label>L-sit niveau</label>
        <select id="lsit">
          <option value="0">Nog niet</option>
          <option value="1">Tuck hold</option>
          <option value="2">Korte L-sit</option>
          <option value="3">Goede L-sit</option>
          <option value="4">L-sit 20+ sec</option>
        </select>
      </div>

      <div>
        <label>Planche niveau</label>
        <select id="planche">
          <option value="0">Nog niet</option>
          <option value="1">Planche lean</option>
          <option value="2">Frog stand</option>
          <option value="3">Tuck planche</option>
          <option value="4">Advanced tuck</option>
        </select>
      </div>

      <div>
        <label>Trainingsdagen per week</label>
        <select id="days">
          <option value="2">2 dagen</option>
          <option value="3">3 dagen</option>
          <option value="4">4 dagen</option>
          <option value="5">5 dagen</option>
        </select>
      </div>

      <div>
        <label>Algemeen niveau</label>
        <select id="level">
          <option value="easy">Beginner</option>
          <option value="normal">Gemiddeld</option>
          <option value="hard">Gevorderd</option>
        </select>
      </div>

      <div>
        <label>Mijn belangrijkste doel</label>
        <select id="goal">
          <option value="strength">Kracht</option>
          <option value="skills">Calisthenics skills</option>
          <option value="pull">Pull-ups verbeteren</option>
          <option value="push">Push-kracht verbeteren</option>
          <option value="core">Core verbeteren</option>
          <option value="balanced">Alles verbeteren</option>
        </select>
      </div>

    </div>

    <button onclick="generateRoutine()">
      🚀 Genereer mijn routine
    </button>

    <button class="secondary" onclick="resetForm()">
      Reset
    </button>
  </div>


  <div id="routine"></div>

</div>


<script>

const $ = id => document.getElementById(id);

function number(id) {
  return Number($(id).value) || 0;
}

function getData() {

  return {
    pushups: number("pushups"),
    pullups: number("pullups"),
    dips: number("dips"),
    squats: number("squats"),
    situps: number("situps"),
    plank: number("plank"),
    handstand: number("handstand"),

    handstandLevel: Number($("handstandLevel").value),
    lsit: Number($("lsit").value),
    planche: Number($("planche").value),

    days: Number($("days").value),
    level: $("level").value,
    goal: $("goal").value
  };
}


/* -------------------------
   BASIS OEFENINGEN
------------------------- */

function repsFromMax(max, percentage = 0.55) {

  if (max <= 0) return 6;

  return Math.max(3, Math.round(max * percentage));
}


function pushExercise(data) {

  if (data.pushups < 8) {
    return {
      name: "Incline push-ups",
      sets: 3,
      reps: 8,
      tag: "Push beginner"
    };
  }

  if (data.pushups < 20) {
    return {
      name: "Push-ups",
      sets: 3,
      reps: repsFromMax(data.pushups, 0.55),
      tag: "Push"
    };
  }

  return {
    name: "Push-ups + langzame reps",
    sets: 4,
    reps: repsFromMax(data.pushups, 0.5),
    tag: "Push"
  };
}


function pullExercise(data) {

  if (data.pullups <= 0) {
    return {
      name: "Australian rows",
      sets: 3,
      reps: 8,
      tag: "Pull beginner"
    };
  }

  if (data.pullups < 5) {
    return {
      name: "Pull-ups met gecontroleerde herhalingen",
      sets: 3,
      reps: Math.max(2, Math.round(data.pullups * 0.5)),
      tag: "Pull"
    };
  }

  return {
    name: "Pull-ups",
    sets: 4,
    reps: Math.max(2, Math.round(data.pullups * 0.55)),
    tag: "Pull"
  };
}


function dipExercise(data) {

  if (data.dips <= 0) {
    return {
      name: "Bench/assisted dips",
      sets: 3,
      reps: 8,
      tag: "Push"
    };
  }

  return {
    name: "Dips",
    sets: 3,
    reps: Math.max(3, Math.round(data.dips * 0.55)),
    tag: "Push"
  };
}


function legExercise(data) {

  if (data.squats < 20) {
    return {
      name: "Bodyweight squats",
      sets: 3,
      reps: 10,
      tag: "Legs"
    };
  }

  return {
    name: "Bodyweight squats",
    sets: 4,
    reps: Math.max(10, Math.round(data.squats * 0.5)),
    tag: "Legs"
  };
}


/* -------------------------
   CORE
------------------------- */

function plankExercise(data) {

  let seconds;

  if (data.plank <= 0) {
    seconds = 20;
  } else {
    seconds = Math.max(20, Math.round(data.plank * 0.5));
  }

  return {
    name: "Plank",
    sets: 3,
    reps: seconds + " sec",
    tag: "Core"
  };
}


function lsitExercise(data) {

  if (data.lsit === 0) {
    return {
      name: "Tuck hold",
      sets: 3,
      reps: "10–15 sec",
      tag: "L-sit voorbereiding"
    };
  }

  if (data.lsit === 1) {
    return {
      name: "Tuck L-sit",
      sets: 3,
      reps: "10–20 sec",
      tag: "L-sit"
    };
  }

  if (data.lsit === 2) {
    return {
      name: "L-sit",
      sets: 3,
      reps: "5–15 sec",
      tag: "L-sit"
    };
  }

  return {
    name: "L-sit",
    sets: 4,
    reps: "10–20 sec",
    tag: "L-sit"
  };
}


/* -------------------------
   HANDSTAND
------------------------- */

function handstandExercise(data) {

  if (data.handstandLevel === 0) {
    return {
      name: "Handstand voorbereiding: wall walks",
      sets: 3,
      reps: "3–5 reps",
      tag: "Handstand"
    };
  }

  if (data.handstandLevel === 1) {
    return {
      name: "Handstand kick-up oefenen",
      sets: 4,
      reps: "3–5 pogingen",
      tag: "Handstand"
    };
  }

  if (data.handstandLevel === 2) {
    return {
      name: "Handstand tegen de muur + kick-ups",
      sets: 4,
      reps: "15–30 sec",
      tag: "Handstand"
    };
  }

  if (data.handstandLevel === 3) {
    return {
      name: "Vrije handstand oefenen",
      sets: 4,
      reps: "10–30 sec totaal per set",
      tag: "Handstand"
    };
  }

  return {
    name: "Handstand techniek",
    sets: 4,
    reps: "20–40 sec gecontroleerd",
    tag: "Handstand"
  };
}


/* -------------------------
   PLANCHE
------------------------- */

function plancheExercise(data) {

  if (data.planche === 0) {
    return {
      name: "Planche lean voorbereiding",
      sets: 3,
      reps: "10–15 sec",
      tag: "Planche"
    };
  }

  if (data.planche === 1) {
    return {
      name: "Planche lean",
      sets: 4,
      reps: "10–20 sec",
      tag: "Planche"
    };
  }

  if (data.planche === 2) {
    return {
      name: "Frog stand",
      sets: 4,
      reps: "10–20 sec",
      tag: "Planche"
    };
  }

  if (data.planche === 3) {
    return {
      name: "Tuck planche",
      sets: 4,
      reps: "5–12 sec",
      tag: "Planche"
    };
  }

  return {
    name: "Advanced tuck planche",
    sets: 4,
    reps: "5–10 sec",
    tag: "Planche"
  };
}


/* -------------------------
   EXTRA OEFENINGEN
------------------------- */

function hollowBody() {

  return {
    name: "Hollow body hold",
    sets: 3,
    reps: "15–30 sec",
    tag: "Core"
  };

}


function lunges() {

  return {
    name: "Lunges",
    sets: 3,
    reps: "8–12 per been",
    tag: "Legs"
  };

}


function scapularPulls() {

  return {
    name: "Scapular pull-ups",
    sets: 3,
    reps: 6,
    tag: "Schouders / pull"
  };

}


/* -------------------------
   ROUTINE MAKEN
------------------------- */

function createDay(data, type) {

  let exercises = [];

  if (type === "push") {

    exercises.push(handstandExercise(data));
    exercises.push(pushExercise(data));
    exercises.push(dipExercise(data));
    exercises.push(plancheExercise(data));
    exercises.push(plankExercise(data));

  }

  if (type === "pull") {

    exercises.push(pullExercise(data));
    exercises.push(scapularPulls());
    exercises.push(lsitExercise(data));
    exercises.push(hollowBody());

  }

  if (type === "legs") {

    exercises.push(legExercise(data));
    exercises.push(lunges());
    exercises.push(plankExercise(data));
    exercises.push(lsitExercise(data));

  }

  if (type === "full") {

    exercises.push(pushExercise(data));
    exercises.push(pullExercise(data));
    exercises.push(legExercise(data));
    exercises.push(lsitExercise(data));
    exercises.push(handstandExercise(data));

  }

  if (type === "skills") {

    exercises.push(handstandExercise(data));
    exercises.push(plancheExercise(data));
    exercises.push(lsitExercise(data));
    exercises.push(hollowBody());

  }

  return exercises;
}


function getDayTypes(days) {

  if (days === 2) {
    return ["full", "full"];
  }

  if (days === 3) {
    return ["push", "pull", "legs"];
  }

  if (days === 4) {
    return ["push", "pull", "legs", "skills"];
  }

  return ["push", "pull", "legs", "skills", "full"];
}


/* -------------------------
   TIPS
------------------------- */

function getTips(data) {

  let tips = [];

  if (data.pullups < 5) {
    tips.push(
      "Voor pull-ups kun je extra aandacht geven aan rows, scapular pull-ups en gecontroleerde herhalingen."
    );
  }

  if (data.handstandLevel < 3) {
    tips.push(
      "Bij handstand is techniek belangrijker dan zo lang mogelijk proberen te staan. Oefen gecontroleerd."
    );
  }

  if (data.planche < 2) {
    tips.push(
      "Planche is een moeilijke skill. Bouw eerst sterke basis met planche leans en goede push-techniek."
    );
  }

  if (data.lsit < 2) {
    tips.push(
      "Voor een L-sit helpen tuck holds en core-oefeningen om de benodigde controle op te bouwen."
    );
  }

  tips.push(
    "Stop een oefening als je scherpe pijn voelt. Een normale spiervermoeidheid is iets anders dan pijn."
  );

  tips.push(
    "Kwaliteit van je herhalingen is belangrijker dan zoveel mogelijk herhalingen doen."
  );

  return tips;
}


/* -------------------------
   HTML
------------------------- */

function exerciseHTML(exercise) {

  return `
    <div class="exercise">
      <div class="exercise-name">
        ${exercise.name}
      </div>

      <div class="details">
        ${exercise.sets} sets × ${exercise.reps}
      </div>

      <span class="tag">
        ${exercise.tag}
      </span>
    </div>
  `;
}


function generateRoutine() {

  const data = getData();

  localStorage.setItem(
    "fitroutineData",
    JSON.stringify(data)
  );

  const types = getDayTypes(data.days);

  let html = `
    <div class="card">

      <h2>🔥 Jouw routine</h2>

      <p>
        Deze routine gebruikt je ingevulde niveaus om de oefeningen
        en moeilijkheid aan te passen.
      </p>

      <div class="summary">

        <div class="stat">
          <strong>${data.days}</strong>
          <span class="small">trainingsdagen</span>
        </div>

        <div class="stat">
          <strong>${data.handstandLevel}/4</strong>
          <span class="small">handstand</span>
        </div>

        <div class="stat">
          <strong>${data.planche}/4</strong>
          <span class="small">planche</span>
        </div>

      </div>

    </div>
  `;


  types.forEach((type, index) => {

    let title = "";

    if (type === "push") title = "Push + Skills";
    if (type === "pull") title = "Pull + Core";
    if (type === "legs") title = "Legs + Core";
    if (type === "skills") title = "Calisthenics Skills";
    if (type === "full") title = "Full Body";

    const exercises = createDay(data, type);

    html += `
      <div class="card day">

        <div class="day-title">
          <h2>Dag ${index + 1} — ${title}</h2>
          <span class="tag">${type}</span>
        </div>

        ${exercises.map(exerciseHTML).join("")}

      </div>
    `;
  });


  html += `
    <div class="card">

      <h2>🧠 Tips voor jou</h2>

      ${getTips(data).map(tip => `
        <div class="tip">
          ${tip}
        </div>
      `).join("")}

      <div class="warning">
        Planche en handstand zijn technische skills.
        Train ze gecontroleerd en geef je lichaam voldoende herstel.
      </div>

    </div>
  `;


  $("routine").innerHTML = html;

  window.scrollTo({
    top: document.getElementById("routine").offsetTop - 15,
    behavior: "smooth"
  });
}


/* -------------------------
   RESET
------------------------- */

function resetForm() {

  localStorage.removeItem("fitroutineData");

  document.querySelectorAll("input").forEach(input => {
    input.value = "";
  });

  $("handstandLevel").value = "0";
  $("lsit").value = "0";
  $("planche").value = "0";
  $("days").value = "3";
  $("level").value = "easy";
  $("goal").value = "balanced";

  $("routine").innerHTML = "";

}


/* -------------------------
   OPSLAAN / TERUGZETTEN
------------------------- */

window.addEventListener("load", () => {

  const saved = localStorage.getItem("fitroutineData");

  if (!saved) return;

  try {

    const data = JSON.parse(saved);

    $("pushups").value = data.pushups || "";
    $("pullups").value = data.pullups || "";
    $("dips").value = data.dips || "";
    $("squats").value = data.squats || "";
    $("situps").value = data.situps || "";
    $("plank").value = data.plank || "";
    $("handstand").value = data.handstand || "";

    $("handstandLevel").value = data.handstandLevel ?? 0;
    $("lsit").value = data.lsit ?? 0;
    $("planche").value = data.planche ?? 0;

    $("days").value = data.days || 3;
    $("level").value = data.level || "easy";
    $("goal").value = data.goal || "balanced";

  } catch (error) {

    console.log("Kon opgeslagen gegevens niet laden.");

  }

});

</script>

</body>
</html>
