<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open World Adventure</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    overflow: hidden;
    background: #111;
    font-family: Arial, sans-serif;
    user-select: none;
}

canvas {
    display: block;
    background: #6dbb58;
}

/* HUD */
#hud {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.65);
    padding: 12px 15px;
    border-radius: 12px;
    min-width: 190px;
    backdrop-filter: blur(5px);
}

.stat {
    margin: 5px 0;
}

.bar {
    width: 150px;
    height: 8px;
    background: #333;
    border-radius: 10px;
    overflow: hidden;
    margin-top: 3px;
}

#healthBar {
    height: 100%;
    width: 100%;
    background: #ff4d4d;
}

#energyBar {
    height: 100%;
    width: 100%;
    background: #4db8ff;
}

/* Quest */
#quest {
    position: fixed;
    top: 15px;
    right: 15px;
    z-index: 10;
    background: rgba(0,0,0,.65);
    color: white;
    padding: 15px;
    border-radius: 12px;
    width: 230px;
}

#quest h3 {
    margin-bottom: 8px;
}

/* Interaction */
#interaction {
    position: fixed;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    background: rgba(0,0,0,.8);
    color: white;
    padding: 12px 22px;
    border-radius: 12px;
    display: none;
}

/* Dialogue */
#dialogue {
    position: fixed;
    left: 50%;
    bottom: 80px;
    transform: translateX(-50%);
    width: min(600px, 90%);
    background: rgba(0,0,0,.92);
    color: white;
    padding: 20px;
    border-radius: 15px;
    z-index: 30;
    display: none;
}

#dialogueName {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 10px;
}

#dialogueText {
    line-height: 1.5;
    margin-bottom: 15px;
}

button {
    border: none;
    padding: 10px 16px;
    border-radius: 9px;
    cursor: pointer;
    background: white;
    color: black;
    font-weight: bold;
}

button:hover {
    opacity: .8;
}

/* Start screen */
#startScreen {
    position: fixed;
    inset: 0;
    background: linear-gradient(135deg, #111, #263238);
    color: white;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
}

.startBox {
    width: min(500px, 90%);
}

.startBox h1 {
    font-size: 45px;
    margin-bottom: 15px;
}

.startBox p {
    color: #bbb;
    margin-bottom: 25px;
}

#nameInput {
    width: 100%;
    padding: 14px;
    border-radius: 10px;
    border: none;
    margin-bottom: 12px;
    font-size: 16px;
}

#startButton {
    width: 100%;
    background: #4caf50;
    color: white;
}

/* Mobile controls */
#mobileControls {
    display: none;
    position: fixed;
    bottom: 20px;
    left: 20px;
    z-index: 15;
}

.controlRow {
    display: flex;
    justify-content: center;
}

.control {
    width: 55px;
    height: 55px;
    margin: 3px;
    border-radius: 12px;
    background: rgba(0,0,0,.55);
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
}

@media (max-width: 700px) {
    #mobileControls {
        display: block;
    }

    #quest {
        width: 180px;
        font-size: 12px;
    }

    #hud {
        font-size: 12px;
        min-width: 150px;
    }

    .startBox h1 {
        font-size: 32px;
    }
}
</style>
</head>

<body>

<div id="startScreen">
    <div class="startBox">
        <h1>🌍 Open World</h1>
        <p>Verken de wereld, praat met NPC's en voltooi quests.</p>

        <input
            id="nameInput"
            placeholder="Jouw naam..."
            maxlength="20"
        >

        <button id="startButton">START GAME</button>
    </div>
</div>

<canvas id="game"></canvas>

<div id="hud">
    <div>🧍 <span id="playerName">Speler</span></div>
    <div class="stat">❤️ Health</div>
    <div class="bar">
        <div id="healthBar"></div>
    </div>

    <div class="stat">⚡ Energy</div>
    <div class="bar">
        <div id="energyBar"></div>
    </div>

    <div class="stat">💰 €<span id="money">0</span></div>
    <div class="stat">⭐ XP <span id="xp">0</span></div>
</div>

<div id="quest">
    <h3>📜 Quest</h3>
    <div id="questText">
        Zoek iemand om mee te praten.
    </div>
</div>

<div id="interaction">
    Druk op <b>E</b> om interactie te hebben
</div>

<div id="dialogue">
    <div id="dialogueName">NPC</div>
    <div id="dialogueText"></div>
    <button id="dialogueButton">Doorgaan</button>
</div>

<div id="mobileControls">
    <div class="controlRow">
        <div class="control" data-key="w">▲</div>
    </div>

    <div class="controlRow">
        <div class="control" data-key="a">◀</div>
        <div class="control" data-key="s">▼</div>
        <div class="control" data-key="d">▶</div>
    </div>
</div>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();

/* =========================
   GAME DATA
========================= */

let player = {
    x: 1000,
    y: 1000,
    size: 28,
    speed: 3,
    sprintSpeed: 5,
    health: 100,
    energy: 100,
    money: 0,
    xp: 0,
    name: "Speler"
};

let keys = {};

let camera = {
    x: 0,
    y: 0
};

let world = {
    width: 3000,
    height: 3000
};

let quest = {
    started: false,
    completed: false,
    reward: 100
};

let dialogueOpen = false;
let currentNPC = null;

/* =========================
   INPUT
========================= */

window.addEventListener("keydown", e => {
    keys[e.key.toLowerCase()] = true;

    if (e.key.toLowerCase() === "e") {
        interact();
    }

    if (e.key === "Escape") {
        closeDialogue();
    }
});

window.addEventListener("keyup", e => {
    keys[e.key.toLowerCase()] = false;
});

/* Mobile */
document.querySelectorAll(".control").forEach(button => {

    const key = button.dataset.key;

    button.addEventListener("touchstart", e => {
        e.preventDefault();
        keys[key] = true;
    });

    button.addEventListener("touchend", e => {
        e.preventDefault();
        keys[key] = false;
    });
});

/* =========================
   WORLD
========================= */

const buildings = [
    {x:300,y:300,w:300,h:220,color:"#d88b68"},
    {x:850,y:250,w:350,h:250,color:"#8e9cc4"},
    {x:1500,y:400,w:300,h:250,color:"#c9a56a"},
    {x:2200,y:300,w:400,h:250,color:"#aa7ac4"},
    {x:400,y:1700,w:350,h:250,color:"#d86f6f"},
    {x:1200,y:1600,w:400,h:300,color:"#7c9bca"},
    {x:2050,y:1800,w:400,h:300,color:"#d29c57"}
];

const trees = [];

for (let i = 0; i < 100; i++) {

    trees.push({
        x: Math.random() * world.width,
        y: Math.random() * world.height,
        size: 20 + Math.random() * 20
    });
}

const npcs = [
    {
        name: "Alex",
        x: 700,
        y: 900,
        color: "#3498db",
        text: "Hey! Kun je mij helpen? Ik ben iets kwijtgeraakt."
    },
    {
        name: "Sam",
        x: 1800,
        y: 1100,
        color: "#e67e22",
        text: "Welkom in onze stad! Er is hier veel te ontdekken."
    },
    {
        name: "Mila",
        x: 2300,
        y: 2300,
        color: "#9b59b6",
        text: "Ik heb gehoord dat er ergens een geheime plek is..."
    }
];

/* =========================
   DRAWING
========================= */

function drawWorld() {

    ctx.fillStyle = "#67b857";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    /* Wegen */

    ctx.fillStyle = "#777";

    ctx.fillRect(
        -camera.x,
        1300 - camera.y,
        world.width,
        180
    );

    ctx.fillRect(
        1350 - camera.x,
        -camera.y,
        180,
        world.height
    );

    /* Water */

    ctx.fillStyle = "#4fa3d1";

    ctx.fillRect(
        2500 - camera.x,
        -camera.y,
        500,
        900
    );

    /* Buildings */

    buildings.forEach(b => {

        ctx.fillStyle = "#333";

        ctx.fillRect(
            b.x - camera.x + 8,
            b.y - camera.y + 8,
            b.w,
            b.h
        );

        ctx.fillStyle = b.color;

        ctx.fillRect(
            b.x - camera.x,
            b.y - camera.y,
            b.w,
            b.h
        );

        /* Windows */

        ctx.fillStyle = "#ffe28a";

        for (let x = b.x + 30; x < b.x + b.w - 20; x += 70) {
            for (let y = b.y + 30; y < b.y + b.h - 20; y += 70) {

                ctx.fillRect(
                    x - camera.x,
                    y - camera.y,
                    25,
                    30
                );
            }
        }
    });

    /* Trees */

    trees.forEach(t => {

        ctx.fillStyle = "#654321";

        ctx.fillRect(
            t.x - camera.x - 4,
            t.y - camera.y,
            8,
            t.size
        );

        ctx.fillStyle = "#26733a";

        ctx.beginPath();

        ctx.arc(
            t.x - camera.x,
            t.y - camera.y,
            t.size,
            0,
            Math.PI * 2
        );

        ctx.fill();
    });

    /* NPCs */

    npcs.forEach(npc => {

        ctx.fillStyle = npc.color;

        ctx.beginPath();

        ctx.arc(
            npc.x - camera.x,
            npc.y - camera.y,
            18,
            0,
            Math.PI * 2
        );

        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 13px Arial";
        ctx.textAlign = "center";

        ctx.fillText(
            npc.name,
            npc.x - camera.x,
            npc.y - camera.y - 27
        );
    });

    /* Player */

    ctx.fillStyle = "#111";

    ctx.beginPath();

    ctx.arc(
        player.x - camera.x,
        player.y - camera.y,
        player.size / 2 + 3,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "#ffcc66";

    ctx.beginPath();

    ctx.arc(
        player.x - camera.x,
        player.y - camera.y,
        player.size / 2,
        0,
        Math.PI * 2
    );

    ctx.fill();

    ctx.fillStyle = "white";
    ctx.font = "bold 13px Arial";

    ctx.fillText(
        player.name,
        player.x - camera.x,
        player.y - camera.y - 25
    );
}

/* =========================
   MOVEMENT
========================= */

function updatePlayer() {

    if (dialogueOpen) return;

    let dx = 0;
    let dy = 0;

    if (keys["w"] || keys["arrowup"]) dy--;
    if (keys["s"] || keys["arrowdown"]) dy++;
    if (keys["a"] || keys["arrowleft"]) dx--;
    if (keys["d"] || keys["arrowright"]) dx++;

    if (dx !== 0 || dy !== 0) {

        const length = Math.sqrt(dx * dx + dy * dy);

        dx /= length;
        dy /= length;

        let speed = player.speed;

        if (keys["shift"] && player.energy > 0) {
            speed = player.sprintSpeed;
            player.energy -= 0.8;
        } else {
            player.energy += 0.4;
        }

        player.energy = Math.max(
            0,
            Math.min(100, player.energy)
        );

        player.x += dx * speed;
        player.y += dy * speed;
    }

    /* World boundaries */

    player.x = Math.max(
        20,
        Math.min(world.width - 20, player.x)
    );

    player.y = Math.max(
        20,
        Math.min(world.height - 20, player.y)
    );
}

/* =========================
   CAMERA
========================= */

function updateCamera() {

    camera.x = player.x - canvas.width / 2;
    camera.y = player.y - canvas.height / 2;

    camera.x = Math.max(
        0,
        Math.min(
            world.width - canvas.width,
            camera.x
        )
    );

    camera.y = Math.max(
        0,
        Math.min(
            world.height - canvas.height,
            camera.y
        )
    );
}

/* =========================
   NPC INTERACTION
========================= */

function getNearbyNPC() {

    let closest = null;
    let distance = Infinity;

    npcs.forEach(npc => {

        const dx = npc.x - player.x;
        const dy = npc.y - player.y;

        const d = Math.sqrt(dx * dx + dy * dy);

        if (d < distance) {
            distance = d;
            closest = npc;
        }
    });

    if (distance < 70) {
        return closest;
    }

    return null;
}

function interact() {

    if (dialogueOpen) return;

    const npc = getNearbyNPC();

    if (!npc) return;

    currentNPC = npc;

    document.getElementById("dialogueName").textContent =
        npc.name;

    if (!quest.started) {

        document.getElementById("dialogueText").textContent =
            npc.text;

        quest.started = true;

        document.getElementById("questText").textContent =
            "Ga naar Sam om de quest te vervolgen.";

    } else if (
        quest.started &&
        npc.name === "Sam" &&
        !quest.completed
    ) {

        document.getElementById("dialogueText").textContent =
            "Goed gedaan! Hier is je beloning.";

        player.money += quest.reward;
        player.xp += 100;

        quest.completed = true;

        document.getElementById("questText").textContent =
            "✅ Quest voltooid!";

        saveGame();

    } else {

        document.getElementById("dialogueText").textContent =
            npc.text;
    }

    dialogueOpen = true;

    document.getElementById("dialogue").style.display =
        "block";
}

function closeDialogue() {

    dialogueOpen = false;

    document.getElementById("dialogue").style.display =
        "none";
}

document.getElementById("dialogueButton").onclick =
    closeDialogue;

/* =========================
   HUD
========================= */

function updateHUD() {

    document.getElementById("playerName").textContent =
        player.name;

    document.getElementById("money").textContent =
        player.money;

    document.getElementById("xp").textContent =
        player.xp;

    document.getElementById("healthBar").style.width =
        player.health + "%";

    document.getElementById("energyBar").style.width =
        player.energy + "%";

    const npc = getNearbyNPC();

    document.getElementById("interaction").style.display =
        npc && !dialogueOpen ? "block" : "none";
}

/* =========================
   SAVE SYSTEM
========================= */

function saveGame() {

    const saveData = {
        player,
        quest
    };

    localStorage.setItem(
        "openWorldSave",
        JSON.stringify(saveData)
    );
}

function loadGame() {

    const saved =
        localStorage.getItem("openWorldSave");

    if (!saved) return;

    try {

        const data = JSON.parse(saved);

        player = data.player || player;
        quest = data.quest || quest;

    } catch (error) {

        console.log("Save kon niet worden geladen.");
    }
}

/* =========================
   GAME LOOP
========================= */

function gameLoop() {

    updatePlayer();
    updateCamera();

    drawWorld();
    updateHUD();

    requestAnimationFrame(gameLoop);
}

/* =========================
   START
========================= */

document.getElementById("startButton").onclick = () => {

    const name =
        document.getElementById("nameInput").value.trim();

    if (name.length > 0) {
        player.name = name;
    }

    loadGame();

    /* Naam uit input behouden */
    player.name = name || player.name;

    document.getElementById("startScreen").style.display =
        "none";

    saveGame();

    gameLoop();
};

/* Autosave */

setInterval(() => {

    if (
        document.getElementById("startScreen").style.display
        === "none"
    ) {
        saveGame();
    }

}, 5000);
</script>

</body>
</html>
